<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PAKET CONTROL CENTER — Package Data & Monitoring System</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Google Fonts: Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['"Plus Jakarta Sans"', 'sans-serif'] },
          colors: {
            rg: {
              cyan: '#1CB0F6',
              teal: '#2BC0E4',
              blue: '#0F52BA',
              navy: '#0A2540',
              orange: '#FF8A00',
              peach: '#FFF4E5',
              surface: '#F6F9FD',
              border: '#E3ECF6'
            }
          }
        }
      }
    }
  </script>
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #F6F9FD; color: #1E293B; }
    .rg-gradient { background: linear-gradient(100deg, #18A4E0 0%, #20B6D5 45%, #6C63FF 100%); }
    .custom-scroll::-webkit-scrollbar { width: 6px; height: 6px; }
    .custom-scroll::-webkit-scrollbar-track { background: #EDF3F9; }
    .custom-scroll::-webkit-scrollbar-thumb { background: #CBD8E6; border-radius: 6px; }
  </style>
</head>
<body class="min-h-screen flex flex-col antialiased custom-scroll">

  <!-- TOP APP BAR -->
  <header class="bg-white border-b border-rg-border sticky top-0 z-30 shadow-xs">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
      <div class="flex items-center gap-3 cursor-pointer" onclick="navigate('dashboard')">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-sky-500 to-indigo-600 flex items-center justify-center text-white shadow-md">
          <i data-lucide="package-check" class="w-5 h-5"></i>
        </div>
        <div>
          <div class="flex items-center gap-2">
            <span class="text-base font-extrabold tracking-tight text-slate-900">PAKET<span class="text-sky-500">CONTROL</span></span>
            <span class="text-[10px] bg-sky-100 text-sky-800 font-bold px-2 py-0.5 rounded-full uppercase tracking-wider">REKAP SYSTEM</span>
          </div>
          <p class="text-[11px] text-slate-400 font-medium">Package Management & Verification</p>
        </div>
      </div>

      <!-- PETUGAS PIKET SELECTOR -->
      <div class="flex items-center gap-3">
        <div class="flex items-center gap-2 bg-slate-50 border border-slate-200 rounded-full px-3 py-1.5 shadow-2xs">
          <div class="w-7 h-7 rounded-full bg-sky-500 text-white flex items-center justify-center font-bold text-xs">
            <i data-lucide="user" class="w-3.5 h-3.5"></i>
          </div>
          <select id="select-petugas" onchange="changePetugas(this.value)" class="text-xs font-bold text-slate-700 bg-transparent focus:outline-none cursor-pointer">
            <option value="Sultan Maulana">Sultan Maulana</option>
            <option value="Dzaka Rozan">Dzaka Rozan</option>
            <option value="Ghani Rizky">Ghani Rizky</option>
          </select>
        </div>
      </div>
    </div>

    <!-- NAVIGATION PILLS -->
    <div class="bg-white border-t border-slate-100 px-4 sm:px-6 lg:px-8">
      <div class="max-w-7xl mx-auto flex items-center gap-2 overflow-x-auto py-2 custom-scroll text-xs font-semibold">
        <button onclick="navigate('dashboard')" id="nav-dashboard" class="nav-pill flex items-center gap-2 px-4 py-2 rounded-full text-slate-600 hover:bg-slate-100 transition shrink-0">
          <i data-lucide="layout-dashboard" class="w-4 h-4 text-sky-500"></i>
          <span>Dashboard</span>
        </button>
        <button onclick="navigate('input')" id="nav-input" class="nav-pill flex items-center gap-2 px-4 py-2 rounded-full text-slate-600 hover:bg-slate-100 transition shrink-0">
          <i data-lucide="plus-circle" class="w-4 h-4 text-emerald-500"></i>
          <span>Input Paket Masuk</span>
        </button>
        <button onclick="navigate('live')" id="nav-live" class="nav-pill flex items-center gap-2 px-4 py-2 rounded-full text-slate-600 hover:bg-slate-100 transition shrink-0">
          <i data-lucide="list-checks" class="w-4 h-4 text-indigo-500"></i>
          <span>Data Live Preview</span>
        </button>
        <button onclick="navigate('rekap')" id="nav-rekap" class="nav-pill flex items-center gap-2 px-4 py-2 rounded-full text-slate-600 hover:bg-slate-100 transition shrink-0">
          <i data-lucide="bar-chart-3" class="w-4 h-4 text-purple-500"></i>
          <span>Rekapitulasi & Export</span>
        </button>
        <button onclick="navigate('migrasi')" id="nav-migrasi" class="nav-pill flex items-center gap-2 px-4 py-2 rounded-full text-slate-600 hover:bg-slate-100 transition shrink-0">
          <i data-lucide="arrow-left-right" class="w-4 h-4 text-amber-500"></i>
          <span>Migrasi Data / Backup</span>
        </button>
      </div>
    </div>
  </header>

  <!-- MAIN CONTAINER -->
  <main class="flex-1 w-full max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6 space-y-6">
    <div id="app-container"></div>
  </main>

  <footer class="bg-white border-t border-slate-200/80 py-4 text-center text-xs text-slate-400">
    <p>“Streamlined Package Tracking System” • Rekap Paket Sekolah</p>
  </footer>

  <script>
    // --- JADWAL HARI ---
    const jadwalHari = {
      1: ["12"],                           // Senin
      2: ["11", "10"],                     // Selasa
      3: ["9A", "9B"],                     // Rabu
      4: ["9C", "9D", "9E"],               // Kamis
      5: ["8A", "8B"],                     // Jumat
      6: ["8C", "8D", "8E"],               // Sabtu
      0: []                                // Minggu
    };
    const namaHari = ["Minggu", "Senin", "Selasa", "Rabu", "Kamis", "Jumat", "Sabtu"];
    const allKelasList = ["12", "11", "10", "9A", "9B", "9C", "9D", "9E", "8A", "8B", "8C", "8D", "8E"];

    // Storage Engine & State
    let dataRekap = JSON.parse(localStorage.getItem('rekapPaketData_UI')) || JSON.parse(localStorage.getItem('rekapPaketData')) || [];
    let currentPetugas = localStorage.getItem('activePetugas_UI') || "Sultan Maulana";
    let selectedKelasInput = "";
    let activeFilterRekap = "hari";

    function saveDB() {
      localStorage.setItem('rekapPaketData_UI', JSON.stringify(dataRekap));
      localStorage.setItem('rekapPaketData', JSON.stringify(dataRekap));
    }

    function changePetugas(name) {
      currentPetugas = name;
      localStorage.setItem('activePetugas_UI', name);
      if (currentTab === 'dashboard') {
        renderDashboard(document.getElementById('app-container'));
      }
    }

    let currentTab = 'dashboard';

    function navigate(tabId) {
      currentTab = tabId;
      document.querySelectorAll('.nav-pill').forEach(btn => {
        btn.classList.remove('bg-sky-500', 'text-white', 'shadow-sm');
        btn.classList.add('text-slate-600');
      });
      const activeBtn = document.getElementById('nav-' + tabId);
      if (activeBtn) {
        activeBtn.classList.add('bg-sky-500', 'text-white', 'shadow-sm');
        activeBtn.classList.remove('text-slate-600');
      }

      const container = document.getElementById('app-container');
      if (tabId === 'dashboard') renderDashboard(container);
      else if (tabId === 'input') renderInput(container);
      else if (tabId === 'live') renderLive(container);
      else if (tabId === 'rekap') renderRekap(container);
      else if (tabId === 'migrasi') renderMigrasi(container);

      lucide.createIcons();
    }

    // --- DASHBOARD VIEW ---
    function renderDashboard(container) {
      const todayISO = new Date().toISOString().split('T')[0];
      const todayIndex = new Date().getDay();
      const kelasHariIni = jadwalHari[todayIndex] || [];

      const todayData = dataRekap.filter(d => d.rawTanggal === todayISO);
      const countSesuai = todayData.filter(d => d.isSesuai).length;
      const countLuar = todayData.filter(d => !d.isSesuai).length;

      // Sambutan Khusus Petugas
      let titleSambutan = `Selamat Datang, ${currentPetugas} 👋`;
      let subSambutan = "Selamat bertugas! Rekap penerimaan paket siswa harian makin gampang, akurat, lan terorganisir.";

      if (currentPetugas === "Sultan Maulana") {
        titleSambutan = "Yo watsap Bos Lanaa! 🚀";
        subSambutan = "Siap rekap paket dina iki? Bikin kabeh data rapi, sat-set, lan terorganisir tanpa ribet!";
      }

      document.getElementById('select-petugas').value = currentPetugas;

      container.innerHTML = `
        <div class="rg-gradient rounded-3xl p-6 sm:p-8 text-white shadow-lg relative overflow-hidden">
          <div class="relative z-10 flex flex-col md:flex-row md:items-center justify-between gap-6">
            <div class="space-y-2">
              <div class="inline-flex items-center gap-2 bg-white/20 backdrop-blur-md px-3 py-1 rounded-full text-xs font-semibold">
                <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                <span>Sistem Monitoring Paket Aktif</span>
              </div>
              <h2 class="text-2xl sm:text-3xl font-extrabold tracking-tight">
                ${titleSambutan}
              </h2>
              <p class="text-white/90 text-sm max-w-xl">
                ${subSambutan}
              </p>
            </div>
            <div class="bg-white/10 backdrop-blur-md border border-white/20 p-4 rounded-2xl flex items-center gap-4 text-xs shrink-0">
              <div class="w-12 h-12 rounded-xl bg-white text-sky-600 flex items-center justify-center font-bold text-lg shadow-sm">
                <i data-lucide="calendar" class="w-6 h-6 text-sky-600"></i>
              </div>
              <div>
                <span class="text-white/70 block text-[11px] font-semibold">Hari Ini: ${namaHari[todayIndex]}</span>
                <span class="text-white font-bold text-sm block">Jadwal Kelas: ${kelasHariIni.length > 0 ? kelasHariIni.join(', ') : 'Libur Reguler'}</span>
              </div>
            </div>
          </div>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
          <div class="bg-white p-5 rounded-2xl border border-slate-200/80 shadow-xs">
            <div class="flex items-center justify-between text-slate-400 text-xs font-bold mb-2">
              <span>TOTAL PAKET HARI INI</span>
              <i data-lucide="package" class="w-4 h-4 text-sky-500"></i>
            </div>
            <div class="text-3xl font-black text-slate-900">${todayData.length}</div>
            <p class="text-[11px] text-slate-400 mt-1">Total masuk tanggal ${todayISO}</p>
          </div>

          <div class="bg-white p-5 rounded-2xl border border-slate-200/80 shadow-xs">
            <div class="flex items-center justify-between text-slate-400 text-xs font-bold mb-2">
              <span>SESUAI JADWAL</span>
              <i data-lucide="check-circle-2" class="w-4 h-4 text-emerald-500"></i>
            </div>
            <div class="text-3xl font-black text-emerald-600">${countSesuai}</div>
            <p class="text-[11px] text-slate-400 mt-1">Sesuai kelas reguler</p>
          </div>

          <div class="bg-white p-5 rounded-2xl border border-slate-200/80 shadow-xs">
            <div class="flex items-center justify-between text-slate-400 text-xs font-bold mb-2">
              <span>DI LUAR JADWAL / ONLINE</span>
              <i data-lucide="alert-circle" class="w-4 h-4 text-amber-500"></i>
            </div>
            <div class="text-3xl font-black text-amber-600">${countLuar}</div>
            <p class="text-[11px] text-slate-400 mt-1">Paket pengecualian/legalitas</p>
          </div>
        </div>

        <div class="bg-white rounded-3xl border border-slate-200/80 shadow-xs p-6">
          <div class="flex items-center justify-between mb-4">
            <div>
              <h3 class="text-sm font-extrabold text-slate-900">Rekap Input Terbaru</h3>
              <p class="text-xs text-slate-400">Data penerimaan paket terkini</p>
            </div>
            <button onclick="navigate('live')" class="text-xs font-bold text-sky-600 hover:text-sky-700 flex items-center gap-1">
              Lihat Semua <i data-lucide="chevron-right" class="w-4 h-4"></i>
            </button>
          </div>
          <div class="overflow-x-auto">
            <table class="w-full text-left text-xs">
              <thead class="text-slate-400 border-b border-slate-100 font-bold uppercase tracking-wider">
                <tr>
                  <th class="pb-3">Tanggal Rekap</th>
                  <th class="pb-3">Nama Penerima</th>
                  <th class="pb-3">Kelas</th>
                  <th class="pb-3">Petugas</th>
                  <th class="pb-3">Status / Legalitas</th>
                </tr>
              </thead>
              <tbody class="divide-y divide-slate-100 text-slate-700">
                ${dataRekap.slice(-5).reverse().map(d => `
                  <tr>
                    <td class="py-3 font-medium text-slate-500">${d.tglFormatted || d.rawTanggal}</td>
                    <td class="py-3 font-bold text-slate-900">${d.nama}</td>
                    <td class="py-3 font-semibold text-slate-700">${d.kelas}</td>
                    <td class="py-3 font-medium text-slate-500">${d.petugas || '-'}</td>
                    <td class="py-3">
                      ${d.isSesuai 
                        ? `<span class="px-2.5 py-0.5 rounded-full text-[10px] font-bold bg-emerald-50 text-emerald-700">Sesuai Jadwal</span>`
                        : `<span class="px-2.5 py-0.5 rounded-full text-[10px] font-bold bg-amber-50 text-amber-700">${d.keterangan ? 'Dilegalkan (' + d.keterangan + ')' : 'Luar Jadwal'}</span>`
                      }
                    </td>
                  </tr>
                `).join('')}
              </tbody>
            </table>
          </div>
        </div>
      `;
    }

    // --- INPUT VIEW ---
    function renderInput(container) {
      const todayStr = new Date().toISOString().split('T')[0];
      selectedKelasInput = "";

      const lastRecord = dataRekap.length > 0 ? dataRekap[dataRekap.length - 1] : null;

      container.innerHTML = `
        <div class="max-w-3xl mx-auto bg-white rounded-3xl border border-slate-200/80 shadow-xs p-6 sm:p-8 space-y-6">
          <h2 class="text-xl font-extrabold text-slate-900">Input Paket Masuk</h2>

          <form id="formPaket" onsubmit="handleSavePaket(event)" class="space-y-6">
            <div>
              <label class="block text-xs font-bold text-slate-700 mb-1.5">Tanggal Rekap / Paket Masuk</label>
              <input type="date" id="inp-tanggal" value="${todayStr}" onchange="renderKelasButtons(this.value)" required class="w-full bg-white border border-slate-200 rounded-xl p-3 text-sm font-semibold focus:ring-2 focus:ring-sky-500 focus:outline-none shadow-2xs" />
            </div>

            <div>
              <label class="block text-xs font-bold text-slate-700 mb-1.5">Nama Penerima</label>
              <input type="text" id="inp-nama" required placeholder="Masukkan nama siswa atau penerima" class="w-full bg-white border border-slate-200 rounded-xl p-3 text-sm font-medium focus:ring-2 focus:ring-sky-500 focus:outline-none shadow-2xs" />
            </div>

            <div>
              <label class="block text-xs font-bold text-slate-700 mb-2">Pilih Kelas</label>
              <div id="kelas-btn-container" class="flex flex-wrap gap-2.5"></div>
              <p class="text-[11px] text-slate-400 font-medium mt-2">Hijau = sesuai jadwal (Diutamakan di atas). Merah = di luar jadwal.</p>
            </div>

            <div>
              <label class="block text-xs font-bold text-slate-700 mb-2">Keterangan Paket</label>
              <div class="grid grid-cols-2 sm:grid-cols-4 gap-2 mb-2">
                <button type="button" onclick="setKeteranganQuick('Online')" class="py-2.5 px-4 bg-white hover:bg-slate-50 border border-slate-200 rounded-xl text-xs font-bold text-slate-700 shadow-2xs transition">Online</button>
                <button type="button" onclick="setKeteranganQuick('Non-online')" class="py-2.5 px-4 bg-white hover:bg-slate-50 border border-slate-200 rounded-xl text-xs font-bold text-slate-700 shadow-2xs transition">Non-online</button>
                <button type="button" onclick="setKeteranganQuick('HRL')" class="py-2.5 px-4 bg-white hover:bg-slate-50 border border-slate-200 rounded-xl text-xs font-bold text-slate-700 shadow-2xs transition">HRL</button>
                <button type="button" onclick="setKeteranganQuick('Food')" class="py-2.5 px-4 bg-white hover:bg-slate-50 border border-slate-200 rounded-xl text-xs font-bold text-slate-700 shadow-2xs transition">Food</button>
              </div>
              <input type="text" id="inp-keterangan" placeholder="Atau ketik keterangan khusus di sini..." class="w-full bg-white border border-slate-200 rounded-xl p-3 text-xs font-medium focus:ring-2 focus:ring-sky-500 focus:outline-none shadow-2xs" />
            </div>

            <button type="submit" class="w-full py-3.5 bg-blue-600 hover:bg-blue-700 text-white font-extrabold rounded-xl text-sm shadow-md transition uppercase tracking-wider">
              SIMPAN DATA PAKET
            </button>
          </form>

          ${lastRecord ? `
            <div class="bg-sky-50/60 border border-sky-100 rounded-2xl p-4 flex items-center gap-3">
              <span class="text-lg">📌</span>
              <div class="text-xs">
                <span class="font-extrabold text-slate-800 block">Input Terakhir</span>
                <span class="text-slate-500 font-medium">${lastRecord.nama} — Kelas ${lastRecord.kelas} \vert{}${lastRecord.tglFormatted || lastRecord.rawTanggal}</span>
              </div>
            </div>
          ` : ''}
        </div>
      `;

      renderKelasButtons(todayStr);
    }

    function renderKelasButtons(rawDate) {
      const selectedDate = new Date(rawDate + "T00:00:00");
      const dayIndex = selectedDate.getDay();
      const kelasAllowed = jadwalHari[dayIndex] || [];
      const container = document.getElementById('kelas-btn-container');

      if (!container) return;

      // KELAS IJO DIUTAMAKAN DI ATAS
      const sortedKelas = [...allKelasList].sort((a, b) => {
        const aSesuai = kelasAllowed.includes(a);
        const bSesuai = kelasAllowed.includes(b);
        if (aSesuai && !bSesuai) return -1;
        if (!aSesuai && bSesuai) return 1;
        return 0;
      });

      container.innerHTML = sortedKelas.map(k => {
        const isSesuai = kelasAllowed.includes(k);
        const isSelected = selectedKelasInput === k;
        
        let bgClass = isSesuai ? "bg-emerald-600 hover:bg-emerald-700 text-white" : "bg-rose-500 hover:bg-rose-600 text-white";
        let borderClass = isSelected ? "ring-4 ring-sky-300 scale-105" : "";

        return `
          <button type="button" onclick="selectKelasBtn('${k}')" id="btn-k-${k}" class="w-12 h-10 sm:w-14 sm:h-11 rounded-xl font-extrabold text-xs sm:text-sm shadow-xs transition flex items-center justify-center ${bgClass} ${borderClass}">
            ${k}
          </button>
        `;
      }).join('');
    }

    function selectKelasBtn(k) {
      selectedKelasInput = k;
      const rawDate = document.getElementById('inp-tanggal').value;
      renderKelasButtons(rawDate);
    }

    function setKeteranganQuick(val) {
      document.getElementById('inp-keterangan').value = val;
    }

    function handleSavePaket(e) {
      e.preventDefault();

      if (!selectedKelasInput) {
        alert("⚠️ Harap pilih salah satu Kelas terlebih dahulu!");
        return;
      }

      const rawTanggal = document.getElementById('inp-tanggal').value;
      const selectedDate = new Date(rawTanggal + "T00:00:00");
      const dayIndex = selectedDate.getDay();
      const kelasAllowed = jadwalHari[dayIndex] || [];

      const nama = document.getElementById('inp-nama').value.trim();
      const kelas = selectedKelasInput;
      const keterangan = document.getElementById('inp-keterangan').value.trim();

      const tglFormatted = `${namaHari[dayIndex]}, ${selectedDate.toLocaleDateString('id-ID')}`;
      const isSesuai = kelasAllowed.includes(kelas);

      dataRekap.push({
        id: Date.now(),
        rawTanggal,
        tglFormatted,
        nama,
        kelas,
        keterangan,
        isSesuai,
        petugas: currentPetugas
      });

      saveDB();
      alert('✅ Data paket berhasil disimpan!');
      renderInput(document.getElementById('app-container'));
    }

    // --- LIVE VIEW ---
    function renderLive(container) {
      const sesuai = dataRekap.filter(d => d.isSesuai);
      const luar = dataRekap.filter(d => !d.isSesuai);

      container.innerHTML = `
        <div class="space-y-6">
          <div class="bg-white p-6 rounded-3xl border border-slate-200/80 shadow-xs">
            <h3 class="text-sm font-extrabold text-slate-900 mb-4">✅ Data Sesuai Jadwal</h3>
            <div class="overflow-x-auto">
              <table class="w-full text-left text-xs">
                <thead class="bg-slate-50 font-bold text-slate-400 uppercase">
                  <tr><th class="p-3">Tanggal</th><th class="p-3">Nama</th><th class="p-3">Kelas</th><th class="p-3">Petugas</th><th class="p-3">Aksi</th></tr>
                </thead>
                <tbody class="divide-y divide-slate-100">
                  ${sesuai.map(d => `
                    <tr>
                      <td class="p-3">${d.tglFormatted || d.rawTanggal}</td>
                      <td class="p-3 font-bold">${d.nama}</td>
                      <td class="p-3 font-semibold">${d.kelas}</td>
                      <td class="p-3 text-slate-500">${d.petugas || '-'}</td>
                      <td class="p-3"><button onclick="deletePaket(${d.id})" class="text-rose-600 font-bold hover:underline">Hapus</button></td>
                    </tr>
                  `).join('')}
                </tbody>
              </table>
            </div>
          </div>

          <div class="bg-white p-6 rounded-3xl border border-slate-200/80 shadow-xs">
            <h3 class="text-sm font-extrabold text-slate-900 mb-4">⚠️ Data Di Luar Jadwal (Online/Izin)</h3>
            <div class="overflow-x-auto">
              <table class="w-full text-left text-xs">
                <thead class="bg-slate-50 font-bold text-slate-400 uppercase">
                  <tr><th class="p-3">Tanggal</th><th class="p-3">Nama</th><th class="p-3">Kelas</th><th class="p-3">Keterangan</th><th class="p-3">Petugas</th><th class="p-3">Status</th><th class="p-3">Aksi</th></tr>
                </thead>
                <tbody class="divide-y divide-slate-100">
                  ${luar.map(d => `
                    <tr>
                      <td class="p-3">${d.tglFormatted || d.rawTanggal}</td>
                      <td class="p-3 font-bold">${d.nama}</td>
                      <td class="p-3 font-semibold">${d.kelas}</td>
                      <td class="p-3">${d.keterangan || '-'}</td>
                      <td class="p-3 text-slate-500">${d.petugas || '-'}</td>
                      <td class="p-3">
                        <span class="px-2 py-0.5 rounded font-bold text-[10px] ${d.keterangan ? 'bg-amber-100 text-amber-800' : 'bg-rose-100 text-rose-800'}">
                          ${d.keterangan ? 'Dilegalkan' : 'Belum Dilegalkan'}
                        </span>
                      </td>
                      <td class="p-3"><button onclick="deletePaket(${d.id})" class="text-rose-600 font-bold hover:underline">Hapus</button></td>
                    </tr>
                  `).join('')}
                </tbody>
              </table>
            </div>
          </div>
        </div>
      `;
    }

    function deletePaket(id) {
      if (confirm('Apakah Bos yakin mau menghapus data ini?')) {
        dataRekap = dataRekap.filter(d => d.id !== id);
        saveDB();
        navigate(currentTab);
      }
    }

    // --- REKAP VIEW (DISAMAKAN DENGAN SCREENSHOT BARU) ---
    function renderRekap(container) {
      const todayISO = new Date().toISOString().split('T')[0];

      container.innerHTML = `
        <div class="bg-white p-6 rounded-3xl border border-slate-200/80 shadow-xs space-y-6">
          <!-- HEADER TAB REKAP -->
          <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
            <div class="flex items-center gap-2">
              <span class="text-xl">📊</span>
              <h2 class="text-lg font-extrabold text-slate-900">Rekapitulasi Data Paket</h2>
            </div>
            <button onclick="exportCSV('semua')" class="px-5 py-2.5 bg-sky-500 hover:bg-sky-600 text-white font-extrabold rounded-xl text-xs shadow-sm transition">
              Export Semua Data
            </button>
          </div>

          <!-- SUB FILTER PERIODIK -->
          <div class="flex flex-wrap gap-2 border-b border-slate-100 pb-4">
            <button onclick="filterPeriodik('hari', this)" class="sub-filter-btn px-4 py-2 rounded-full text-xs font-extrabold transition bg-sky-500 text-white shadow-xs">Hari Ini</button>
            <button onclick="filterPeriodik('minggu', this)" class="sub-filter-btn px-4 py-2 rounded-full text-xs font-extrabold text-slate-600 bg-slate-100 hover:bg-slate-200 transition">Minggu Ini</button>
            <button onclick="filterPeriodik('bulan', this)" class="sub-filter-btn px-4 py-2 rounded-full text-xs font-extrabold text-slate-600 bg-slate-100 hover:bg-slate-200 transition">Bulan Ini</button>
            <button onclick="filterPeriodik('semua', this)" class="sub-filter-btn px-4 py-2 rounded-full text-xs font-extrabold text-slate-600 bg-slate-100 hover:bg-slate-200 transition">Semua Data</button>
          </div>

          <!-- CARDS STATISTIK -->
          <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
            <div class="bg-white p-5 rounded-2xl border border-slate-100 shadow-xs text-center space-y-1">
              <span class="text-xs font-bold text-slate-400">Total Paket</span>
              <div id="stat-total" class="text-3xl font-black text-slate-900">0</div>
            </div>
            <div class="bg-white p-5 rounded-2xl border border-slate-100 shadow-xs text-center space-y-1">
              <span class="text-xs font-bold text-slate-400">Sesuai Jadwal</span>
              <div id="stat-sesuai" class="text-3xl font-black text-emerald-600">0</div>
            </div>
            <div class="bg-white p-5 rounded-2xl border border-slate-100 shadow-xs text-center space-y-1">
              <span class="text-xs font-bold text-slate-400">Di Luar Jadwal</span>
              <div id="stat-luar" class="text-3xl font-black text-amber-600">0</div>
            </div>
          </div>

          <!-- DATE PICKER FILTER EXPORT KHUSUS -->
          <div class="bg-slate-50 p-4 rounded-2xl border border-slate-200/80 flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4">
            <div class="space-y-1">
              <span class="text-xs font-extrabold text-slate-800 block">📅 Export Rentang Tanggal Khusus:</span>
              <div class="flex items-center gap-2">
                <input type="date" id="export-start" value="${todayISO}" class="bg-white border border-slate-200 rounded-lg p-2 text-xs font-bold" />
                <span class="text-xs font-bold text-slate-400">s/d</span>
                <input type="date" id="export-end" value="${todayISO}" class="bg-white border border-slate-200 rounded-lg p-2 text-xs font-bold" />
              </div>
            </div>
            <button onclick="exportCSVByDateRange()" class="px-4 py-2 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-xl text-xs shadow-xs transition shrink-0">
              Export Rentang Tanggal
            </button>
          </div>

          <!-- TABEL REKAP -->
          <div class="overflow-x-auto">
            <table class="w-full text-left text-xs">
              <thead class="text-slate-500 font-extrabold border-b border-slate-100">
                <tr>
                  <th class="pb-3 w-32">Tanggal</th>
                  <th class="pb-3">Nama</th>
                  <th class="pb-3 w-20">Kelas</th>
                  <th class="pb-3 w-32">Kategori</th>
                  <th class="pb-3">Keterangan</th>
                </tr>
              </thead>
              <tbody id="tabel-rekap-body" class="divide-y divide-slate-100 text-slate-700"></tbody>
            </table>
          </div>
        </div>
      `;

      filterPeriodik('hari', document.querySelector('.sub-filter-btn'));
    }

    function filterPeriodik(period, btn) {
      document.querySelectorAll('.sub-filter-btn').forEach(b => {
        b.classList.remove('bg-sky-500', 'text-white', 'shadow-xs');
        b.classList.add('text-slate-600', 'bg-slate-100');
      });
      if(btn) {
        btn.classList.add('bg-sky-500', 'text-white', 'shadow-xs');
        btn.classList.remove('text-slate-600', 'bg-slate-100');
      }

      activeFilterRekap = period;
      const todayISO = new Date().toISOString().split('T')[0];
      const now = new Date();

      let filtered = dataRekap.filter(d => {
        if (!d.rawTanggal) return false;
        const itemDate = new Date(d.rawTanggal + "T00:00:00");

        if (period === 'hari') return d.rawTanggal === todayISO;
        if (period === 'minggu') {
          const diffTime = Math.abs(now - itemDate);
          const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
          return diffDays <= 7;
        }
        if (period === 'bulan') return itemDate.getMonth() === now.getMonth() && itemDate.getFullYear() === now.getFullYear();
        return true;
      });

      document.getElementById('stat-total').innerText = filtered.length;
      document.getElementById('stat-sesuai').innerText = filtered.filter(d => d.isSesuai).length;
      document.getElementById('stat-luar').innerText = filtered.filter(d => !d.isSesuai).length;

      const tbody = document.getElementById('tabel-rekap-body');
      tbody.innerHTML = '';

      if (filtered.length === 0) {
        tbody.innerHTML = `<tr><td colspan="5" class="py-8 text-center text-slate-400 font-medium">Belum ada data untuk periode ini.</td></tr>`;
        return;
      }

      filtered.forEach(d => {
        tbody.innerHTML += `
          <tr>
            <td class="py-3 font-medium text-slate-500">${d.tglFormatted || d.rawTanggal}</td>
            <td class="py-3 font-bold text-slate-900">${d.nama}</td>
            <td class="py-3 font-semibold text-slate-700">${d.kelas}</td>
            <td class="py-3">
              <span class="px-2.5 py-0.5 rounded-full text-[10px] font-bold ${d.isSesuai ? 'bg-emerald-50 text-emerald-700' : 'bg-amber-50 text-amber-700'}">
                ${d.isSesuai ? 'Sesuai Jadwal' : 'Di Luar Jadwal'}
              </span>
            </td>
            <td class="py-3 text-slate-600">${d.keterangan || '-'}</td>
          </tr>
        `;
      });
    }

    function exportCSV(tipe) {
      if (!dataRekap.length) {
        alert('Ora ana data sing bisa di-export, Bos!');
        return;
      }
      generateCSVBlob(dataRekap, `Rekap_Paket_TOTAL_${new Date().toISOString().slice(0,10)}.csv`);
    }

    function exportCSVByDateRange() {
      const start = document.getElementById('export-start').value;
      const end = document.getElementById('export-end').value;

      if (!start || !end) {
        alert('⚠️ Harap pilih tanggal mulai dan tanggal akhir!');
        return;
      }

      const filtered = dataRekap.filter(d => d.rawTanggal >= start && d.rawTanggal <= end);

      if (!filtered.length) {
        alert(`Ora ana data paket ing rentang tanggal ${start} s/d ${end}!`);
        return;
      }

      generateCSVBlob(filtered, `Rekap_Paket_${start}_sd_${end}.csv`);
    }

    function generateCSVBlob(listData, filename) {
      const BOM = "\uFEFF";
      let csvRows = [["Tanggal Rekap", "Nama", "Kelas", "Kategori Rekap", "Keterangan", "Petugas", "Status Legalitas"].join(",")];

      listData.forEach(i => {
        let kategori = i.isSesuai ? "Sesuai Jadwal" : "Di Luar Jadwal";
        let status = i.isSesuai ? "Sesuai Jadwal" : (i.keterangan ? `Dilegalkan (${i.keterangan})` : "Belum Dilegalkan");
        csvRows.push([
          `"${(i.tglFormatted || i.rawTanggal).replace(/"/g, '""')}"`,
          `"${i.nama.replace(/"/g, '""')}"`,
          `"${i.kelas}"`,
          `"${kategori}"`,
          `"${(i.keterangan || '-').replace(/"/g, '""')}"`,
          `"${i.petugas || '-'}"`,
          `"${status.replace(/"/g, '""')}"`
        ].join(","));
      });

      const blob = new Blob([BOM + csvRows.join("\n")], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = filename;
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }

    // --- TAB MIGRASI DATA ---
    function renderMigrasi(container) {
      const jsonString = JSON.stringify(dataRekap, null, 2);

      container.innerHTML = `
        <div class="space-y-6">
          <div class="bg-white p-6 rounded-3xl border border-slate-200/80 shadow-xs">
            <h3 class="text-sm font-extrabold text-slate-900 mb-1">📤 Export / Copy Data Lokal</h3>
            <p class="text-xs text-slate-400 mb-4">Salin kode JSON ing ngisor kiye kanggo disimpen utawa dipindah menyang piranti/web liyane.</p>
            <textarea id="txt-export" readonly class="w-full h-36 bg-slate-50 border border-slate-200 rounded-xl p-3 font-mono text-[11px] text-slate-700 focus:outline-none">${jsonString}</textarea>
            <button onclick="copyExportJSON()" class="mt-2 px-4 py-2 bg-sky-500 hover:bg-sky-600 text-white font-bold rounded-xl text-xs flex items-center gap-2">
              <i data-lucide="copy" class="w-4 h-4"></i> Copy Kode JSON
            </button>
          </div>

          <div class="bg-white p-6 rounded-3xl border border-slate-200/80 shadow-xs">
            <h3 class="text-sm font-extrabold text-slate-900 mb-1">📥 Import / Paste Data saka Canva Code</h3>
            <p class="text-xs text-slate-400 mb-4">Paste kode JSON saka web Canva/backup lawas ing ngisor iki, banjur klik tombol **Import Data**.</p>
            <textarea id="txt-import" placeholder='Paste kode JSON nang kene (Contoh: [{"nama":"Budi","kelas":"8A"...}])' class="w-full h-36 bg-slate-50 border border-slate-200 rounded-xl p-3 font-mono text-[11px] text-slate-700 focus:bg-white focus:ring-2 focus:ring-amber-500 focus:outline-none"></textarea>
            <button onclick="importJSONData()" class="mt-2 px-4 py-2 bg-amber-500 hover:bg-amber-600 text-white font-bold rounded-xl text-xs flex items-center gap-2">
              <i data-lucide="download-cloud" class="w-4 h-4"></i> Import & Gabung Data
            </button>
          </div>
        </div>
      `;
    }

    function copyExportJSON() {
      const copyText = document.getElementById("txt-export");
      copyText.select();
      document.execCommand("copy");
      alert("✅ Kode JSON berhasil di-copy!");
    }

    function importJSONData() {
      const importVal = document.getElementById("txt-import").value.trim();
      if (!importVal) {
        alert("⚠️ Tempelna (paste) kode JSON dhisik, Bos!");
        return;
      }
      try {
        const parsed = JSON.parse(importVal);
        if (Array.isArray(parsed)) {
          dataRekap = parsed;
          saveDB();
          alert(`✅ Sukses! ${parsed.length} data berhasil di-import & dipindah.`);
          navigate('dashboard');
        } else {
          alert("❌ Format JSON ora valid (kudu wujud Array/Daftar data).");
        }
      } catch (err) {
        alert("❌ Gagal maca JSON: " + err.message);
      }
    }

    window.addEventListener('DOMContentLoaded', () => {
      navigate('dashboard');
    });
  </script>
