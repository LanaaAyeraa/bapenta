<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paket Control Center</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --primary: #007aff;
            --bg-gradient: linear-gradient(135deg, #e0c3fc 0%, #8ec5fc 100%);
            --glass-bg: rgba(255, 255, 255, 0.65);
            --glass-border: rgba(255, 255, 255, 0.8);
        }

        body {
            background: var(--bg-gradient);
            background-attachment: fixed;
            min-height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            overflow-x: hidden;
        }

        .glass-panel {
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            box-shadow: 0 8px 32px rgba(31, 38, 135, 0.12);
        }

        /* ANIMASI PESAWAT BANNER */
        #airplane-container {
            position: fixed;
            top: 25px;
            left: -800px;
            display: flex;
            align-items: center;
            z-index: 99999;
            pointer-events: none;
            transition: transform 12s linear;
        }

        .propeller {
            transform-origin: center;
            animation: spin 0.08s linear infinite;
        }
        @keyframes spin { 100% { transform: rotate(360deg); } }

        .banner-cloth {
            background: #ffffff;
            color: #1a252f;
            padding: 12px 30px 12px 20px;
            font-weight: 900;
            font-size: 18px;
            letter-spacing: 1.5px;
            border-radius: 4px 0 0 4px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
            position: relative;
            clip-path: polygon(0% 0%, 100% 0%, 90% 50%, 100% 100%, 0% 100%);
            border: 1px solid #e2e8f0;
            white-space: nowrap;
        }

        /* Responsive Layout Grid */
        .main-layout {
            display: grid;
            grid-template-columns: 280px 1fr 320px;
            gap: 20px;
        }

        @media (max-width: 1024px) {
            .main-layout {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body class="p-4 md:p-6">

    <!-- ANIMASI PESAWAT BANNER REALISTIS -->
    <div id="airplane-container">
        <!-- SVG Pesawat Putih -->
        <svg width="140" height="60" viewBox="0 0 140 60" fill="none">
            <path d="M10 28 L110 18 L135 28 L110 38 L10 28 Z" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
            <path d="M40 25 L25 5 L45 5 L65 23 Z" fill="#e2e8f0"/>
            <path d="M40 31 L25 51 L45 51 L65 33 Z" fill="#cbd5e1"/>
            <path d="M110 22 L130 10 L135 28 Z" fill="#f1f5f9"/>
            <circle cx="138" cy="28" r="3" fill="#475569"/>
            <line x1="138" y1="12" x2="138" y2="44" stroke="#94a3b8" stroke-width="2" class="propeller"/>
        </svg>

        <!-- Tali Penarik V-Shape -->
        <svg width="60" height="40" viewBox="0 0 60 40" style="margin-left: -10px;">
            <line x1="0" y1="20" x2="60" y2="2" stroke="#64748b" stroke-width="1.5" stroke-dasharray="3,2"/>
            <line x1="0" y1="20" x2="60" y2="38" stroke="#64748b" stroke-width="1.5" stroke-dasharray="3,2"/>
        </svg>

        <!-- Banner Kain Putih -->
        <div class="banner-cloth">
            <span>✈️ SEMANGATT BRAYY REKAP NYAA 📦</span>
        </div>
    </div>

    <!-- HEADER APPLICATION -->
    <header class="glass-panel p-4 mb-6 flex justify-between items-center max-w-7xl mx-auto">
        <div class="flex items-center gap-3">
            <span class="text-2xl">📦</span>
            <h1 class="text-xl font-bold text-gray-800">Paket Control Center</h1>
        </div>
        
        <!-- Tombol Pesawat Header (Hanya Logo ✈️) -->
        <button onclick="maburPesawat()" class="w-10 h-10 rounded-full bg-amber-400 hover:bg-amber-500 text-white font-bold flex items-center justify-center shadow-lg transition active:scale-95" title="Maburna Pesawat">
            ✈️
        </button>
    </header>

    <!-- LAYOUT UTAMA 3 KOLOM -->
    <div class="main-layout max-w-7xl mx-auto">
        
        <!-- KOLOM KIWA: MUSIC PLAYER -->
        <aside class="glass-panel p-4 h-fit">
            <h2 class="font-bold text-gray-700 mb-3 flex items-center gap-2">🎵 Music Player</h2>
            <div class="space-y-4">
                <div class="rounded-xl overflow-hidden shadow">
                    <iframe style="border-radius:12px" src="https://open.spotify.com/embed/playlist/37i9dQZF1DXcBWIGoYBM5M?utm_source=generator" width="100%" height="152" frameBorder="0" allowfullscreen="" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" loading="lazy"></iframe>
                </div>
            </div>
        </aside>

        <!-- KOLOM TENGAH: MAIN CONTENT / INPUT FORM -->
        <main class="space-y-6">
            <div class="glass-panel p-6">
                <h2 class="text-lg font-bold text-gray-800 mb-4">📥 Input Data Paket</h2>
                
                <div id="alertSuccess" class="hidden mb-4 p-3 bg-green-100 text-green-700 font-semibold rounded-xl text-center">
                    ✅ Data Berhasil Dikirim ke Google Sheet!
                </div>

                <form id="paketForm" onsubmit="event.preventDefault(); simpanData();" class="space-y-4">
                    <div>
                        <label class="block text-sm font-semibold text-gray-600 mb-1">Tanggal Rekap</label>
                        <input type="date" id="tanggal" class="w-full p-3 rounded-xl border border-gray-300 focus:outline-none focus:ring-2 focus:ring-blue-500 bg-white/80" required>
                    </div>

                    <div>
                        <label class="block text-sm font-semibold text-gray-600 mb-1">Nama Penerima</label>
                        <input type="text" id="nama" placeholder="Masukkan nama penerima" class="w-full p-3 rounded-xl border border-gray-300 focus:outline-none focus:ring-2 focus:ring-blue-500 bg-white/80" required>
                    </div>

                    <div>
                        <label class="block text-sm font-semibold text-gray-600 mb-1">Kelas</label>
                        <select id="kelas" class="w-full p-3 rounded-xl border border-gray-300 focus:outline-none focus:ring-2 focus:ring-blue-500 bg-white/80" required>
                            <option value="">-- Pilih Kelas --</option>
                            <option value="12">12</option>
                            <option value="11">11</option>
                            <option value="10">10</option>
                            <option value="9A">9A</option><option value="9B">9B</option><option value="9C">9C</option><option value="9D">9D</option><option value="9E">9E</option>
                            <option value="8A">8A</option><option value="8B">8B</option><option value="8C">8C</option><option value="8D">8D</option><option value="8E">8E</option>
                        </select>
                    </div>

                    <div>
                        <label class="block text-sm font-semibold text-gray-600 mb-1">Keterangan Paket</label>
                        <input type="text" id="keterangan" placeholder="Contoh: Paket Online / Urgent" class="w-full p-3 rounded-xl border border-gray-300 focus:outline-none focus:ring-2 focus:ring-blue-500 bg-white/80">
                    </div>

                    <button type="submit" id="btnSubmit" class="w-full py-4 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-xl shadow-lg transition active:scale-98">
                        KIRIM KE GOOGLE SHEET
                    </button>
                </form>
            </div>

            <!-- TABEL PREVIEW DATA LIVE -->
            <div class="glass-panel p-6">
                <h3 class="font-bold text-gray-800 mb-3">📋 Data Terbaru (Live)</h3>
                <div class="overflow-x-auto">
                    <table class="w-full text-left text-sm text-gray-700">
                        <thead class="bg-white/50 border-b border-gray-200">
                            <tr>
                                <th class="p-3">Tanggal</th>
                                <th class="p-3">Nama</th>
                                <th class="p-3">Kelas</th>
                                <th class="p-3">Keterangan</th>
                            </tr>
                        </thead>
                        <tbody id="tabelData" class="divide-y divide-gray-200">
                            <!-- Data bakal mlebu nang kene -->
                        </tbody>
                    </table>
                </div>
            </div>
        </main>

        <!-- KOLOM TENGEN: AI ASSISTANT -->
        <aside class="glass-panel p-4 h-fit flex flex-col h-[500px]">
            <h2 class="font-bold text-gray-700 mb-3 flex items-center gap-2">🤖 AI Assistant</h2>
            <div id="chatBox" class="flex-1 overflow-y-auto space-y-3 p-2 bg-white/40 rounded-xl mb-3 text-sm">
                <div class="bg-blue-100 text-blue-900 p-3 rounded-xl max-w-[85%]">
                    Halo Bos Lanaa! Ana sing bisa tak bantu kanggo rekap dina iki?
                </div>
            </div>
            <div class="flex gap-2">
                <input type="text" id="chatInput" placeholder="Ketik pesan..." class="flex-1 p-2 rounded-lg border border-gray-300 text-sm focus:outline-none bg-white/80">
                <button onclick="kirimChat()" class="bg-blue-600 text-white px-3 py-2 rounded-lg font-bold text-sm">Kirim</button>
            </div>
        </aside>

    </div>

    <script>
        // ⚠️ PASTE URL WEB APP APPS SCRIPT SAMPEYAN NANG KENE:
        const URL_APPS_SCRIPT = "PASTE_URL_WEB_APP_SAMPEYAN_NANG_KENE";

        // Set Default Tanggal Dina Iki
        document.getElementById('tanggal').value = new Date().toISOString().split('T')[0];

        // LOGIKA PESAWAT MABUR
        let isFlying = false;
        function maburPesawat() {
            if (isFlying) return;
            isFlying = true;
            
            const plane = document.getElementById('airplane-container');
            const screenWidth = window.innerWidth + 1000;
            
            plane.style.transform = `translateX(${screenWidth}px)`;
            
            setTimeout(() => {
                plane.style.transition = 'none';
                plane.style.transform = 'translateX(0px)';
                setTimeout(() => {
                    plane.style.transition = 'transform 12s linear';
                    isFlying = false;
                }, 50);
            }, 12000);
        }

        // MABUR OTOMATIS SABEN 2.5 MENIT (150.000 ms)
        setInterval(maburPesawat, 150000);

        // SIMPAN DATA KE APPS SCRIPT & TAMPILKAN DI TABEL
        async function simpanData() {
            const rawTanggal = document.getElementById('tanggal').value;
            const nama = document.getElementById('nama').value.trim();
            const kelas = document.getElementById('kelas').value;
            const keterangan = document.getElementById('keterangan').value.trim() || '-';

            const btn = document.getElementById('btnSubmit');
            btn.disabled = true;
            btn.innerText = "Mengirim...";

            const payload = {
                rawTanggal,
                tglFormatted: new Date(rawTanggal).toLocaleDateString('id-ID', { weekday: 'long', year: 'numeric', month: 'numeric', day: 'numeric' }),
                nama,
                kelas,
                keterangan
            };

            // Tambah Data menyang Tabel Live (Baris Paling Dhuwur)
            const tbody = document.getElementById('tabelData');
            const newRow = `
                <tr class="bg-white/40">
                    <td class="p-3">${payload.tglFormatted}</td>
                    <td class="p-3 font-semibold">${payload.nama}</td>
                    <td class="p-3">${payload.kelas}</td>
                    <td class="p-3">${payload.keterangan}</td>
                </tr>`;
            tbody.insertAdjacentHTML('afterbegin', newRow);

            // Kirim maring Apps Script
            try {
                if(URL_APPS_SCRIPT !== "PASTE_URL_WEB_APP_SAMPEYAN_NANG_KENE") {
                    await fetch(URL_APPS_SCRIPT, {
                        method: 'POST',
                        mode: 'no-cors',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });
                }
                
                document.getElementById('alertSuccess').classList.remove('hidden');
                document.getElementById('nama').value = '';
                document.getElementById('keterangan').value = '';
                setTimeout(() => { document.getElementById('alertSuccess').classList.add('hidden'); }, 3000);
            } catch(e) {
                alert("Gagal ngirim data maring Apps Script!");
            }

            btn.disabled = false;
            btn.innerText = "KIRIM KE GOOGLE SHEET";
        }

        // SIMULASI CHAT AI
        function kirimChat() {
            const input = document.getElementById('chatInput');
            const msg = input.value.trim();
            if(!msg) return;

            const chatBox = document.getElementById('chatBox');
            chatBox.innerHTML += `<div class="bg-gray-200 text-gray-800 p-2 rounded-xl max-w-[85%] ml-auto text-right">${msg}</div>`;
            input.value = '';

            setTimeout(() => {
                chatBox.innerHTML += `<div class="bg-blue-100 text-blue-900 p-2 rounded-xl max-w-[85%]">Siap Bos Lanaa! Tetep semangat rekape! 🔥</div>`;
                chatBox.scrollTop = chatBox.scrollHeight;
            }, 600);
        }
    </script>
</body>
</html>
